schema_version: ores.compose.v1
project: iso-lattes-desktop
allow_lazy_start: false
source:
  repository: https://github.com/iso-lattes/isl-desktop-daemon.git
  commit: d851b798fd8948d7c91508db538710fef75a6f78
  checkout_dir: tmp/dev/isl-desktop-daemon
services:
  daemon:
    runtime: host
    build:
      - ["cargo", "build", "--release", "--locked"]
    command: ["./target/release/isl-desktop-daemon"]
    environment:
      ISL_DESKTOP_ADDR: "127.0.0.1:8761"
    healthcheck:
      command: ["curl", "--fail", "--silent", "http://127.0.0.1:8761/healthz"]
      interval_ms: 250
      timeout_ms: 1000
      retries: 20
