name: desktop-contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: desktop-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ORES_COMMON_DESKTOP_REVISION: 7bb4ed89ab4aa4a81c5e26e36b91f58d6313cc7c

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Require fleet read credential
        env:
          FLEET_TOKEN: ${{ secrets.FLEET_GITHUB_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FLEET_TOKEN" || {
            echo "FLEET_GITHUB_READ_TOKEN is required to consume the private common desktop layer" >&2
            exit 1
          }

      - name: Check out exact common desktop layer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ORESoftware/ores-common-desktop-infra
          ref: ${{ env.ORES_COMMON_DESKTOP_REVISION }}
          path: tmp/dev/ores-common-desktop-infra
          token: ${{ secrets.FLEET_GITHUB_READ_TOKEN }}
          persist-credentials: false

      - name: Verify exact common revision
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git -C tmp/dev/ores-common-desktop-infra rev-parse HEAD)"
          test "$actual" = "$ORES_COMMON_DESKTOP_REVISION"

      - name: Validate through common desktop implementation
        env:
          ORES_COMMON_DESKTOP_EXPECTED_REVISION: ${{ env.ORES_COMMON_DESKTOP_REVISION }}
        run: |
          cargo run --locked             --manifest-path tmp/dev/ores-common-desktop-infra/daemon/rust/Cargo.toml             --bin ores-common-desktop-consumer-check
