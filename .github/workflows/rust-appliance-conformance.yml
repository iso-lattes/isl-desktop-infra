name: rust-appliance-conformance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-appliance-conformance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out product infra
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust 1.82
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.82.0"
          components: rustfmt,clippy
      - name: Format vendored validator
        run: cargo +1.82.0 fmt --manifest-path tools/appliance-conformance/Cargo.toml -- --check
      - name: Clippy vendored validator
        run: cargo +1.82.0 clippy --manifest-path tools/appliance-conformance/Cargo.toml -- -D warnings
      - name: Validate appliance
        run: cargo +1.82.0 run --manifest-path tools/appliance-conformance/Cargo.toml -- .
